<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sensory UX - Assistente de moda com descrições sensoriais">
  <title>Sensory UX - Assistente de Moda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>👗 Sensory UX</h1>
      <p>Seu assistente de moda inteligente</p>
    </div>
  </header>

  <main class="container">
    <div class="chatbot-container">
      <div class="chat-header">
        <h2>Assistente de Moda</h2>
        <p>Converse comigo sobre roupas e descobriremos juntos!</p>
      </div>

      <div class="chat-messages" id="messagesContainer">
        <!-- Mensagens aparecerão aqui -->
      </div>

      <div class="typing-indicator" id="typingIndicator">
        <span>Digitando...</span>
      </div>

      <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Digite sua mensagem ou use voz..." />
        <button id="sendButton" class="btn btn-primary">Enviar</button>
        <button id="voiceButton" class="btn btn-secondary">🎤 Falar</button>
        <button id="clearButton" class="btn btn-secondary">🗑️ Limpar</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Sensory UX - MVP Hackathon. Desenvolvido com acessibilidade em mente.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
