<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes do produto - Sensory UX">
  <title>Produto | Sensory UX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #f7f5f1;
      color: #111827;
      margin: 0;
    }

    header,
    footer {
      padding: 2rem 0;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    header p,
    footer p {
      margin: 0;
      color: #6b7280;
      max-width: 42rem;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.7;
    }

    main.container {
      padding: 2rem 0 3rem;
    }

    .product-action-message {
      margin-top: 1rem;
      padding: 1rem 1.15rem;
      background: #f5f5f6;
      color: #111827;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      transition: opacity 0.25s ease;
      opacity: 0;
    }

    .product-action-message.visible {
      opacity: 1;
    }

    .product-detail-container {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: start;
      background: #ffffff;
      border-radius: 32px;
      padding: 2.5rem;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.08);
    }

    .product-detail-image img {
      width: 100%;
      height: auto;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .product-detail-info {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .product-detail-category {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #6b7280;
      margin-bottom: 0.5rem;
    }

    .product-detail-name {
      font-size: clamp(2rem, 3vw, 3rem);
      margin: 0;
      color: #111827;
      line-height: 1.02;
    }

    .product-detail-price {
      font-size: clamp(1.8rem, 2.5vw, 2.6rem);
      color: #111827;
      font-weight: 700;
      margin-top: 0.5rem;
    }

    .product-detail-description {
      color: #4b5563;
      line-height: 1.85;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      max-width: 45rem;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .product-actions .btn {
      min-width: 170px;
      border-radius: 999px;
      padding: 0.95rem 1.35rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .product-actions .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
    }

    .product-actions .btn-primary {
      background: #111827;
      color: #ffffff;
      border: 1px solid #111827;
    }

    .product-actions .btn-secondary {
      background: transparent;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .product-actions .btn-secondary:hover {
      background: #f8f7f3;
    }

    @media (max-width: 840px) {
      .product-detail-container {
        grid-template-columns: 1fr;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Sensory UX</h1>
      <p>Produto dinâmico para a experiência de moda sensorial.</p>
    </div>
  </header>

  <main class="container" role="main" aria-label="Detalhes do produto">
    <div id="productDetail"></div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Sensory UX - MVP Hackathon.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function showProductMessage(message) {
      const messageElement = document.getElementById('productMessage');
      if (!messageElement) return;
      messageElement.textContent = message;
      messageElement.classList.add('visible');
      setTimeout(() => {
        messageElement.classList.remove('visible');
      }, 2500);
    }

    function renderProduct(product) {
      const productDetail = document.getElementById('productDetail');
      if (!productDetail) return;

      productDetail.innerHTML = `
        <section class="product-detail-container">
          <div class="product-detail-image">
            <img src="${product.image}" alt="${product.name}" />
          </div>
          <div class="product-detail-info">
            <span class="product-detail-category">${product.type || 'Peça'}</span>
            <h2 class="product-detail-name">${product.name}</h2>
            <div class="product-detail-price">R$ 149,90</div>
            <p class="product-detail-description">${product.sensoryDescription}</p>
            <div class="product-actions">
              <button id="addCartButton" class="btn btn-primary" aria-label="Adicionar ao carrinho">Adicionar ao carrinho</button>
              <button id="checkoutButton" class="btn btn-secondary" aria-label="Finalizar compra">Finalizar compra</button>
            </div>
            <div id="productMessage" class="product-action-message" role="status" aria-live="polite"></div>
          </div>
        </section>
      `;

      document.getElementById('addCartButton').addEventListener('click', () => {
        showProductMessage('Produto adicionado ao carrinho.');
      });

      document.getElementById('checkoutButton').addEventListener('click', () => {
        showProductMessage('Produto adicionado ao carrinho.');
      });
    }

    function renderNotFound() {
      const productDetail = document.getElementById('productDetail');
      if (!productDetail) return;
      productDetail.innerHTML = `
        <section class="product-detail-container">
          <div>
            <h2 class="product-detail-name">Produto não encontrado</h2>
            <p class="product-detail-description">Verifique o link ou retorne à página inicial para explorar outras peças.</p>
            <div class="product-actions">
              <a href="index.html" class="btn btn-primary">Voltar à loja</a>
            </div>
          </div>
        </section>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const id = parseInt(getQueryParam('id'), 10);
      const product = getProductById(id);

      if (product) {
        renderProduct(product);
      } else {
        renderNotFound();
      }
    });
  </script>
</body>
</html>
